# The SDP pipeline — the 28-object DAG (transforms/ + pipelines/ glue).
# transforms/ import retail_lakehouse.* ONLY (never pipelines/ glue — no cross-glob
# imports); the wheel below is what makes those imports resolve on serverless.
resources:
  pipelines:
    retail_lakehouse:
      name: retail_lakehouse
      serverless: true
      catalog: ${var.catalog}
      # Required default schema for UC pipelines. Every declared object fully
      # qualifies its own layer schema (via configuration params); this is the fallback.
      schema: ${resources.schemas.bronze.name}
      libraries:
        - glob:
            include: ../transforms/**
      environment:
        dependencies:
          # Wheel consumption (critical fix): DAB uploads the built artifact and
          # rewrites this path at deploy time.
          - ../dist/*.whl
      configuration:
        catalog: ${var.catalog}
        environment_tag: ${var.environment_tag}   # consumed by the R1 catalog guard
        lateness_window_days: ${var.lateness_window_days}
        git_sha: ${var.git_sha}
        # Actual schema names via resource refs — development mode prefixes schema
        # names (dev_<user>_bronze), so code must NEVER hardcode a schema literal.
        landing_schema: ${resources.schemas.landing.name}
        bronze_schema: ${resources.schemas.bronze.name}
        silver_schema: ${resources.schemas.silver.name}
        gold_schema: ${resources.schemas.gold.name}
        ops_schema: ${resources.schemas.ops.name}
      # TODO: tags, channel, notifications
