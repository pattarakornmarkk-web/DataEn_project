# On merge to develop: full CI -> deploy dev target -> run pipeline -> integration scenario suite.
# This run IS the staging bake; red here blocks promotion to main (branch protection).
name: deploy-dev

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main

      # bundle deploy builds the wheel (python3 -m build) on THIS runner —
      # the ci job's Python setup lives in a different job.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: pip install build

      - name: Deploy bundle (dev)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle deploy --target dev \
            --var="git_sha=${{ github.sha }}" \
            --var="deployed_by=${{ github.actor }}"

      # Runtime validation (slice 7): emulator (day1_clean) -> pipeline -> audit -> invariants
      # (for dev resets / scenario demos use ops-run.yml with full_refresh once it
      #  registers on main at the first release)
      - name: Run orchestrator once
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle run orchestrator --target dev

