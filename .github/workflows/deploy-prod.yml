# On merge to main: validate -> prod environment approval gate -> deploy -> smoke -> release tag.
# workflow_dispatch with `ref` input is the rollback path (redeploy a previous tag).
name: deploy-prod

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or SHA to (re)deploy — rollback path
        required: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: prod   # required-reviewer gate lives on this GitHub Environment
    permissions:
      contents: write   # release tagging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: databricks/setup-cli@main

      # bundle deploy builds the wheel on this runner (see deploy-dev.yml)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: pip install build

      - name: Deploy bundle (prod)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle deploy --target prod \
            --var="git_sha=${{ inputs.ref || github.sha }}" \
            --var="deployed_by=${{ github.actor }}"

      # Smoke: one orchestrator run. In prod the emulator branch is skipped and the
      # landing volume starts empty — an empty run exercising the full DAG + audit +
      # invariants is exactly the "deployed AND working" proof we want.
      - name: Post-deploy smoke
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle run orchestrator --target prod

      # Tag = the rollback anchor (runbook: redeploy a previous tag via the
      # workflow_dispatch `ref` input above). Skipped on rollback re-deploys.
      - name: Tag release
        if: ${{ !inputs.ref }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists — redeploy of the same version, not re-tagging"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
