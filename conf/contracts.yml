# Contracts registry — successor to the legacy config_table, reviewable in PRs.
#
# Two distinct concerns (kept separate — the customer entity has TWO sources):
#   source_contracts: shape of each landed FILE (columns, event identity, op semantics)
#   entity_contracts: shape of each SILVER ENTITY (keys, sequencing, SCD type, tiebreak)
#
# Conventions (loader-enforced):
#   - sequence_by is ALWAYS a list
#   - every scd_type: 2 entity MUST declare tiebreak (ADR-0009)
#   - source columns: non-empty map of column -> known type
#   - unknown fields are load-time errors, never ignored

source_contracts:
  customers:
    identity: [customer_id]
    columns:
      customer_id: bigint
      first_name: string
      last_name: string
      email: string
      phone: string
      birth_date: date
      loyalty_tier: string
      home_store_id: int
      signup_ts: timestamp
      updated_at: timestamp
  products:
    identity: [product_id, effective_date]
    columns:
      product_id: bigint
      sku: string
      product_name: string
      category: string
      subcategory: string
      unit_price: decimal(10,2)
      currency: string
      is_active: boolean
      effective_date: date
  stores:
    identity: [store_id, update_date]
    columns:
      store_id: int
      store_name: string
      region: string
      store_format: string
      manager_name: string
      opened_date: date
      closed_date: date
      update_date: timestamp
  customer_updates:
    identity: [customer_id, change_ts, change_seq]   # event identity, not entity identity
    op_column: op                                    # I/U/D — op-aware DQ rules
    delete_payload: key_only                         # op=D rows carry nulls outside identity
    columns:
      op: string
      customer_id: bigint
      first_name: string
      last_name: string
      email: string
      phone: string
      birth_date: date
      loyalty_tier: string
      home_store_id: int
      source_system: string
      change_ts: timestamp
      change_seq: bigint
  order_events:
    identity: [event_id]
    columns:
      event_id: string
      order_id: bigint
      event_type: string
      customer_id: bigint
      store_id: int
      product_id: bigint
      quantity: int
      unit_price: decimal(10,2)
      currency: string
      event_ts: timestamp
      region_source: string
  customer_activity:
    identity: [activity_id]
    columns:
      activity_id: string
      session_id: string
      customer_id: bigint      # nullable BY DESIGN — anonymous browsing
      activity_type: string
      product_id: bigint
      search_term: string
      device: string
      activity_ts: timestamp

entity_contracts:
  dim_customer:
    sources: [customers, customer_updates]   # unified via _v_customer_cdc_unified (ADR-0004)
    keys: [customer_id]
    scd_type: 2
    sequence_by: [change_ts]
    tiebreak: change_seq
    apply_as_deletes: true
  dim_product:
    sources: [products]
    keys: [product_id]
    scd_type: 2
    sequence_by: [effective_date]
    tiebreak: _ingestion_order   # no natural tiebreaker: _source_file + row position (ADR-0009)
  dim_store:
    sources: [stores]
    keys: [store_id]
    scd_type: 2
    sequence_by: [update_date]
    tiebreak: _ingestion_order
    # closure (closed_date set) is an attribute change, NOT a delete (blueprint §5)
  fct_order_events:
    sources: [order_events]
    keys: [event_id]
    dedup_key: [order_id, event_type]
    sequence_by: [event_ts]
    tiebreak: _ingestion_order
  fct_customer_activity:
    sources: [customer_activity]
    keys: [activity_id]
    sequence_by: [activity_ts]
    tiebreak: _ingestion_order
